name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Golden example — Vitest (record → affected → run) end-to-end
        run: pnpm --filter @covsel/example-vitest-basic e2e
      - name: Golden example — Jest (record → affected → run) end-to-end
        run: pnpm --filter @covsel/example-jest-basic e2e
      - name: Golden example — node:test / generic NODE_V8_COVERAGE end-to-end
        run: pnpm --filter @covsel/example-node-test-basic e2e
      - name: Golden example — cucumber-js scenario-level selection end-to-end
        run: pnpm --filter @covsel/example-cucumber-basic e2e
      - run: pnpm format:check

  select:
    name: covsel selects covsel's own tests
    runs-on: ubuntu-latest
    # Deliberately alongside the `test` job, never instead of it. `test` runs the
    # whole suite and is what gates a merge; this job demonstrates the CI map
    # lifecycle on covsel itself and would be the wrong thing to trust as the
    # only run of the tests -- a selection bug would then hide the failure it
    # caused.
    steps:
      - uses: actions/checkout@v7
        with:
          # Selection measures change from the commit the fetched map records, so
          # the checkout has to contain it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/cache/restore@v4
        with:
          path: .covsel/archive
          key: covsel-archive-${{ github.sha }}
          restore-keys: covsel-archive-

      # No archive yet, or nothing in it this checkout can diff from, is not a
      # failure: covsel falls open and the suite runs in full. Hence no
      # `--require` -- a first pull request on a fresh cache must not go red.
      - name: Fetch the map this checkout can measure change from
        run: node packages/cli/dist/bin.js fetch

      - name: What covsel is about to do, and why
        run: node packages/cli/dist/bin.js status

      - name: Run the affected tests
        run: node packages/cli/dist/bin.js run -- npx vitest run

  validate-selection:
    name: Prove the selection is narrow and sound
    runs-on: ubuntu-latest
    # The `select` job runs whatever covsel chooses. This one checks that the
    # choice was right, which passing tests cannot tell you: a selection that
    # quietly ran nothing would pass too. It bootstraps its own map rather than
    # waiting for one from `main`, so a pull request proves the whole lifecycle
    # on its own -- record at the merge base, publish, fetch at the head, and
    # measure what comes out.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Record and publish a map at the merge base
        run: |
          set -euo pipefail
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "recording at merge base $BASE"
          git checkout -q --detach "$BASE"
          pnpm install --frozen-lockfile
          pnpm build
          node packages/cli/dist/bin.js record -- npx vitest run
          node packages/cli/dist/bin.js publish

      - name: Return to the pull request and fetch that map
        run: |
          set -euo pipefail
          # The archive is gitignored, so it survives the checkout -- which is
          # exactly the trick that lets one job play both sides of the lifecycle.
          git checkout -q --detach "${{ github.event.pull_request.head.sha }}"
          pnpm install --frozen-lockfile
          pnpm build
          node packages/cli/dist/bin.js fetch --require
          node packages/cli/dist/bin.js status

      - name: Check what it selected
        run: node scripts/validate-selection.mjs

      - name: Run exactly that selection
        run: node packages/cli/dist/bin.js run -- npx vitest run

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
