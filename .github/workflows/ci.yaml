name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Golden example — Vitest (record → affected → run) end-to-end
        run: pnpm --filter @covsel/example-vitest-basic e2e
      - name: Golden example — Jest (record → affected → run) end-to-end
        run: pnpm --filter @covsel/example-jest-basic e2e
      - name: Golden example — node:test / generic NODE_V8_COVERAGE end-to-end
        run: pnpm --filter @covsel/example-node-test-basic e2e
      - name: Golden example — cucumber-js scenario-level selection end-to-end
        run: pnpm --filter @covsel/example-cucumber-basic e2e
      - name: Golden example — Mocha through the generic wrap end-to-end
        run: pnpm --filter @covsel/example-mocha-basic e2e
      - run: pnpm format:check

  browser:
    name: Playwright conformance & example (Chromium)
    runs-on: ubuntu-latest
    # Its own job because it needs a browser, and because every conformance check
    # here records against one — a browser launch and an application boot per
    # check. Kept out of `test` so the suite that gates most changes needs
    # nothing installed but Node, and run on every change so the Playwright
    # adapter is held to the same conformance suite as every other adapter. A
    # conformance suite nothing executes certifies nothing.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @covsel/example-playwright-basic exec playwright install --with-deps chromium
      - name: Playwright adapter conformance (records against a served application)
        run: pnpm test:browser
      - name: Golden example — Playwright per-test selection end-to-end
        run: pnpm --filter @covsel/example-playwright-basic e2e

  select:
    name: covsel selects covsel's own tests
    runs-on: ubuntu-latest
    # Deliberately alongside the `test` job, never instead of it. `test` runs the
    # whole suite and is what gates a merge; this job demonstrates the CI map
    # lifecycle on covsel itself and would be the wrong thing to trust as the
    # only run of the tests -- a selection bug would then hide the failure it
    # caused.
    steps:
      - uses: actions/checkout@v7
        with:
          # Selection measures change from the commit the fetched map records, so
          # the checkout has to contain it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/cache/restore@v6
        with:
          path: .covsel/archive
          key: covsel-archive-${{ github.sha }}
          restore-keys: covsel-archive-

      # No archive yet, or nothing in it this checkout can diff from, is not a
      # failure: covsel falls open and the suite runs in full. Hence no
      # `--require` -- a first pull request on a fresh cache must not go red.
      - name: Fetch the map this checkout can measure change from
        run: node packages/cli/dist/bin.js fetch

      - name: What covsel is about to do, and why
        run: node packages/cli/dist/bin.js status

      # Three of this repository's own outages were one failure: covsel's
      # testGlobs and vitest's include list disagreeing about what the suite is.
      # Twice a directory was in vitest's list and not covsel's, so its tests
      # could never be selected and this very job ran none of them; once the
      # reverse, and recording died on a browser test in a job with no browser.
      # `--require` because this repository's adapter can answer, so an
      # unavailable check here means something broke rather than a runner that
      # cannot list.
      - name: Check covsel and vitest still agree on what the suite is
        run: node packages/cli/dist/bin.js doctor --require -- npx vitest run

      # Running the selection proves the tests it chose pass. It says nothing
      # about whether the choice was right -- a selection that quietly ran
      # nothing would pass too -- so the promises that can be checked from
      # outside the selector are checked first. A full run is accepted; there is
      # nothing there to be wrong about.
      - name: Check that the selection kept its promises
        run: node scripts/validate-selection.mjs

      - name: Run the affected tests
        run: node packages/cli/dist/bin.js run -- npx vitest run

  action:
    name: The action drives covsel end to end
    runs-on: ubuntu-latest
    # The action's contract is the CLI's JSON output, which is why it is
    # developed here rather than in the repository it ships from: this job runs
    # it against `packages/cli` at HEAD, so a change to a JSON shape goes red on
    # the pull request that made it instead of reaching a user first.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Against the real archive, so this exercises what a pull request in any
      # repository hits: a map to fetch, or nothing to fetch and a full run.
      # Nothing is run -- the `select` job above already runs the selection, and
      # the `test` job runs the suite.
      - name: Select, and report what it would have run
        id: selection
        uses: ./actions/ci
        with:
          command: npx vitest run
          covsel-command: node packages/cli/dist/bin.js
          dry-run: true

      - name: Check the action answered with facts rather than blanks
        env:
          FULL_RUN: ${{ steps.selection.outputs.full-run }}
          DISCOVERED: ${{ steps.selection.outputs.discovered-count }}
          AFFECTED: ${{ steps.selection.outputs.affected }}
          MAP_STATE: ${{ steps.selection.outputs.map-state }}
        run: |
          set -euo pipefail
          echo "full-run=$FULL_RUN discovered=$DISCOVERED map=$MAP_STATE"
          test "$FULL_RUN" = 'true' -o "$FULL_RUN" = 'false'
          test "$DISCOVERED" -gt 0
          node -e 'JSON.parse(process.env.AFFECTED)'
          # A full run has to enumerate what it will run. An empty list here is
          # the shape that makes a consumer pipe nothing into its runner and call
          # it a pass, so it is checked rather than assumed.
          if [ "$FULL_RUN" = 'true' ]; then
            node -e 'if (JSON.parse(process.env.AFFECTED).length === 0) { throw new Error("a full run reported no test files") }'
          fi

      # The step above installed whichever map it fetched, and `covsel fetch`
      # leaves an existing map alone when it finds nothing -- so an empty archive
      # is not on its own a checkout with nothing to select from. Without this,
      # the step below would select against the previous step's map, and on a
      # pull request touching only `actions/**` that selection is empty: it would
      # run no tests and pass, proving nothing about the path it exists to prove.
      - name: Discard the map the previous step installed
        run: rm -rf .covsel

      # The run step, with nothing to select from, so the full-run path is the one
      # exercised: covsel hands the runner its own command, unfiltered.
      - name: Run the tests through the action, with no map to select from
        id: full
        uses: ./actions/ci
        with:
          command: npx vitest run actions/ci/test/report.test.ts
          covsel-command: node packages/cli/dist/bin.js
          cache-key-prefix: covsel-action-e2e-never-populated-
          summary: 'false'

      # Without this the step above proves nothing: its only signal is an exit
      # code, and selecting against a map left behind by an earlier step would
      # pass just as quietly -- which is the defect that made it worth writing.
      - name: Check that really was the full-run path
        env:
          FULL_RUN: ${{ steps.full.outputs.full-run }}
        run: |
          set -euo pipefail
          test "$FULL_RUN" = 'true' || {
            echo "::error::the no-map invocation selected instead of running in full (full-run=$FULL_RUN)"
            exit 1
          }

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
